name: Domura
options:
  bundleIdPrefix: com.duestudios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Domura:
    type: application
    platform: iOS
    sources: [Domura]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duestudios.domura
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  DomuraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DomuraTests]
    dependencies:
      - target: Domura
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Domura:
    build:
      targets:
        Domura: all
    test:
      targets: [DomuraTests]
